    <div class="header"><h1>Week 3</h1>
        <p>In this week's task, I rendered my chosen piece in verovio, begining by exporting it as a <a href="https://github.com/LyallDavis23/MCA-2025/blob/master/data/halfnelson5.xml"> Musicxml</a> file and an MEI file.</p>
    </div>
    <div id="app">Verovio is loading...</div>
    <script type="module">
        import 'https://www.verovio.org/javascript/app/verovio-app.js';
        
        const options = {
            defaultView: 'responsive', // default is 'responsive', alternative is 'document'
            defaultZoom: 3, // 0-7, default is 4
            enableResponsive: true, // default is true
            enableDocument: true // default is true
        }
        
        // A MusicXML file
        var file = 'data/halfnelsonfinal.mei'; //Replace this with your own MEI file, but remember that JavaScript is case sensitive!
        // A MEI file
        //var file = 'https://www.verovio.org/editor/brahms.mei';
        
        const app = new Verovio.App(document.getElementById("app"), options);
        fetch(file)
            .then(function(response) {
                return response.text();
            })
            .then(function(text) {
                app.loadData(text);
            });
    </script>
    </div>
