<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Piece in Verovio</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: sans-serif;
        }
        .box {
            display: flex;
            flex-flow: column;
            height: 100%;
        }
        .box .header {
            flex: 0 1 auto;
            padding: 10px;
        }
        .box #app {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h1>Week 3</h1>
            <p>In this week's task, I rendered my chosen piece in Verovio, beginning by exporting it as a MusicXML file and an MEI file.</p>
        </div>
        <div id="app">Loading your music...</div>
    </div>

    <script type="module">
        import Verovio from 'https://www.verovio.org/javascript/app/verovio-app.js';

        const appDiv = document.getElementById("app");

        const options = {
            defaultView: 'responsive',    // 'responsive' or 'document'
            defaultZoom: 3,               // 0-7
            enableResponsive: true,
            enableDocument: true
        };

        // Correct relative path to your MEI file
        const file = 'data/HalfNelson.mei';

        // Create Verovio App instance
        const app = new Verovio.App(appDiv, options);

        // Fetch the MEI file and render
        fetch(file)
            .then(response => {
                if (!response.ok) throw new Error(`Failed to load ${file}`);
                return response.text();
            })
            .then(text => {
                appDiv.innerText = "";  // clear loading message
                app.loadData(text);
            })
            .catch(error => {
                console.error(error);
                appDiv.innerText = "Failed to load the MEI file. Check the path.";
            });
    </script>
</body>
</html>
