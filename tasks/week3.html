    <script src="https://www.verovio.org/javascript/latest/verovio-toolkit.js"></script>
    <style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;

    .box {
        display: flex;
        flex-flow: column;
        height: 100%;
    }
    .box .header {
       flex: 0 1 auto;
    }
    .box #app {
        flex: 1 1 auto;
    }
    </style>
</head>
<body>
    <div class="box">
    <div class="header"><h1>Week 3</h1>

      <button id="zoomOut">-</button>
      <button id="zoomIn">+</button>
        <p>In this week's task, I rendered my chosen piece in veriovio, begining by exporting it as a MusicXML file and an MEI file.</p>
    </div>
    <div id="app">Verovio is loading...</div>
    <script>
        const toolkit = new verovio.toolkit()
        
        const options = {
            defaultView: 'responsive', // default is 'responsive', alternative is 'document'
            defaultZoom: 3, // 0-7, default is 4
            enableResponsive: true, // default is true
            enableDocument: true // default is true
        }
        toolkit.setOptions(options)

        fetch('HalfNelson.mei')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load MEI file');
                }
                return response.text();
            })
            .then(meiContent => {
                // Load the MEI content into Verovio
                toolkit.loadData(meiContent);
                const svg = toolkit.renderToSVG(1);
                document.getElementById('app').innerHTML = svg;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('app').innerHTML =
                    '<p>Error loading MEI file. Make sure the file exists and is named correctly.</p>';
            });
